# Redis configuration for the Statsopedia BullMQ queues.
# The password is NOT set here; it is passed via --requirepass from the REDIS_PASSWORD env var.

# BullMQ requires that Redis never evicts keys, otherwise jobs can silently disappear.
maxmemory-policy noeviction

# Persist queue state across container restarts (AOF + periodic RDB snapshots).
appendonly yes
appendfsync everysec
save 900 1
save 300 10
save 60 10000

dir /data
