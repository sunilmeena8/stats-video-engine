[project]
name = "statsopedia-data-processor"
version = "0.1.0"
description = "Statsopedia CSV processing service (FastAPI + Pandas)."
requires-python = ">=3.11"
# Dependencies are pinned in requirements.txt / requirements-dev.txt.

[tool.ruff]
line-length = 100
target-version = "py311"
extend-exclude = [".venv"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "N", "S", "SIM", "RUF"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S101"]

[tool.mypy]
python_version = "3.11"
strict = true
files = ["app", "tests"]
plugins = ["pydantic.mypy"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = "-q"
